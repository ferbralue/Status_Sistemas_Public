name: Status dashboard

on:
  schedule:
    - cron: '*/5 * * * *'   # a cada 5 minutos (o GitHub pode atrasar um pouco)
  workflow_dispatch:         # permite rodar manualmente pela aba Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sistemas e gerar dashboard
        run: python3 status_dashboard.py || true   # o script sai com 1 se algo estiver offline

      - name: Guardar histórico no repositório
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status_history.json
          git commit -m "atualiza histórico de status" || echo "sem mudanças"
          git push

      - name: Preparar site
        run: |
          mkdir site
          cp dashboard.html site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
